<meta charset="UTF-8" />
<title>BUMIRA - Showcase Interaktif</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* ---------- design tokens ---------- */
  :root{
    --blue:#1A5FA8; --blue-dark:#0F4A85; --blue-light:#E3EEFA; --blue-lighter:#F0F6FC;
    --bar-track:#D5E3F2; --bar-mid:#4A8FCF; --bar-light:#A8C8ED;
    --border:#E5EAF0; --ink:#0F1B2A; --ink-muted:#4A5560; --ink-faint:#7A8592;
    --green:#1B7A46; --green-bg:#E3F3EA; --green-border:#B9E0C6;
    --red:#B04A4A; --red-bg:#FBEAEA; --red-border:#F0C4C4;
    --amber:#8A5A0A; --amber-bg:#FCEFD8;
    --surface:#FFFFFF; --canvas:#F7FAFD;
    --shadow: 0 1px 2px rgba(15,27,42,.04), 0 8px 24px rgba(15,27,42,.06);
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --blue:#3D7DC4; --blue-dark:#8FC1F0; --blue-light:#1F3050; --blue-lighter:#182338;
      --bar-track:#1F2C42; --bar-mid:#4A8FCF; --bar-light:#3A5578;
      --border:#263149; --ink:#EAF1F8; --ink-muted:#9FB0C3; --ink-faint:#7C8CA0;
      --green:#4CC183; --green-bg:#16301F; --green-border:#245234;
      --red:#E58B8B; --red-bg:#3A1F22; --red-border:#5C2C30;
      --amber:#E8B85C; --amber-bg:#3A2E14;
      --surface:#141B2E; --canvas:#0E1524;
      --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --blue:#3D7DC4; --blue-dark:#8FC1F0; --blue-light:#1F3050; --blue-lighter:#182338;
    --bar-track:#1F2C42; --bar-mid:#4A8FCF; --bar-light:#3A5578;
    --border:#263149; --ink:#EAF1F8; --ink-muted:#9FB0C3; --ink-faint:#7C8CA0;
    --green:#4CC183; --green-bg:#16301F; --green-border:#245234;
    --red:#E58B8B; --red-bg:#3A1F22; --red-border:#5C2C30;
    --amber:#E8B85C; --amber-bg:#3A2E14;
    --surface:#141B2E; --canvas:#0E1524;
    --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3);
  }
  :root[data-theme="light"]{
    --blue:#1A5FA8; --blue-dark:#0F4A85; --blue-light:#E3EEFA; --blue-lighter:#F0F6FC;
    --bar-track:#D5E3F2; --bar-mid:#4A8FCF; --bar-light:#A8C8ED;
    --border:#E5EAF0; --ink:#0F1B2A; --ink-muted:#4A5560; --ink-faint:#7A8592;
    --green:#1B7A46; --green-bg:#E3F3EA; --green-border:#B9E0C6;
    --red:#B04A4A; --red-bg:#FBEAEA; --red-border:#F0C4C4;
    --amber:#8A5A0A; --amber-bg:#FCEFD8;
    --surface:#FFFFFF; --canvas:#F7FAFD;
    --shadow: 0 1px 2px rgba(15,27,42,.04), 0 8px 24px rgba(15,27,42,.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--canvas);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:var(--serif);}
  h1,h2,h3{text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  ::selection{background:var(--blue-light);}
  a{color:var(--blue);}
  .tabular{font-variant-numeric:tabular-nums;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ---------- topnav ---------- */
  .topnav{
    position:sticky; top:0; z-index:40;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    background-image: repeating-linear-gradient(45deg, color-mix(in srgb, var(--blue) 12%, transparent) 0, color-mix(in srgb, var(--blue) 12%, transparent) 1.5px, transparent 1.5px, transparent 22px);
  }
  .topnav-inner{
    max-width:1180px; margin:0 auto; padding:10px 24px;
    display:flex; align-items:center; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none;}
  .brand-mark{
    width:32px; height:32px; border-radius:9px;
    background:linear-gradient(155deg, var(--blue), var(--blue-dark));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:17px;
  }
  .brand-name{font-weight:800; letter-spacing:.2px; font-size:15.5px;}
  .brand-badge{
    font-size:10px; font-weight:700; letter-spacing:.06em; color:var(--blue-dark);
    background:var(--blue-lighter); border:1px solid var(--border); border-radius:999px;
    padding:3px 8px; margin-left:2px;
  }
  .navlinks{display:flex; align-items:center; gap:2px; flex:1; overflow-x:auto;}
  .navlink{
    border:none; background:none; color:var(--ink-muted); font-size:13.5px; font-weight:600;
    padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  .navlink:hover{background:var(--blue-lighter); color:var(--ink);}
  .navlink.current{background:var(--blue-light); color:var(--blue-dark);}
  .navlink:focus-visible, .icon-btn:focus-visible, button:focus-visible, input:focus-visible, .quest-btn:focus-visible{
    outline:2px solid var(--blue); outline-offset:2px;
  }
  .topnav-actions{display:flex; align-items:center; gap:8px; margin-left:auto;}
  .icon-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-muted);
    width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative;
  }
  .icon-btn:hover{color:var(--blue-dark); border-color:var(--blue);}
  .notif-dot{
    position:absolute; top:-3px; right:-3px; background:var(--red); color:#fff;
    font-size:9.5px; font-weight:800; border-radius:999px; min-width:15px; height:15px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
    border:2px solid var(--surface);
  }
  .avatar-chip{
    width:34px; height:34px; border-radius:9px; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;
    cursor:pointer; border:none;
  }
  .demo-pill{
    font-size:10px; font-weight:700; letter-spacing:.05em; color:var(--amber);
    background:var(--amber-bg); border-radius:999px; padding:3px 9px; white-space:nowrap;
  }

  .panel-pop{
    position:absolute; top:52px; right:24px; width:320px; max-height:70vh; overflow:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);
    z-index:50; padding:6px;
  }
  .panel-pop-head{display:flex; justify-content:space-between; align-items:center; padding:8px 10px 6px;}
  .panel-pop-head strong{font-size:13px;}
  .panel-pop-head span{font-size:11.5px; color:var(--blue-dark); font-weight:700; cursor:pointer;}
  .notif-row{
    display:flex; flex-direction:column; gap:2px; text-align:left; width:100%;
    border:none; background:none; padding:9px 10px; border-radius:9px; cursor:pointer;
  }
  .notif-row:hover{background:var(--blue-lighter);}
  .notif-row.unread{background:var(--blue-light);}
  .notif-row-title{font-size:12.5px; font-weight:600; color:var(--ink);}
  .notif-row-time{font-size:10.5px; color:var(--ink-faint);}
  .notif-empty{padding:20px 10px; text-align:center; font-size:12.5px; color:var(--ink-faint);}

  /* ---------- layout ---------- */
  .screen{max-width:1180px; margin:0 auto; padding:28px 24px 64px;}
  .hidden{display:none !important;}

  .eyebrow{
    font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--blue-dark);
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card-pad{padding:22px;}

  /* ---------- beranda ---------- */
  .hero{padding:56px 0 40px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px;}
  .hero h1{font-size:clamp(28px,4vw,44px); line-height:1.18; max-width:820px;}
  .hero h1 b{color:var(--blue-dark);}
  .hero p{font-size:17px; color:var(--ink-muted); max-width:560px; margin:0;}
  .hero-ctas{display:flex; gap:12px; margin-top:6px; flex-wrap:wrap; justify-content:center;}
  .btn{
    border:none; border-radius:11px; padding:11px 20px; font-size:14px; font-weight:700;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-ghost{background:var(--blue-lighter); color:var(--blue-dark); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--blue);}
  .btn-sm{padding:8px 14px; font-size:12.5px;}
  .hero-stats{display:flex; gap:36px; margin-top:28px; flex-wrap:wrap; justify-content:center;}
  .hero-stat b{display:block; font-family:var(--serif); font-size:26px; color:var(--blue-dark);}
  .hero-stat span{font-size:11.5px; color:var(--ink-faint); letter-spacing:.03em;}
  .hero-note{font-size:11px; color:var(--ink-faint); margin-top:-16px;}

  .steps{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:44px;}
  .step-card{padding:18px; text-align:left;}
  .step-num{font-family:var(--serif); font-size:22px; color:var(--blue-light); font-weight:700;}
  .step-card h3{font-size:14.5px; margin:6px 0 4px;}
  .step-card p{font-size:12.5px; color:var(--ink-muted); margin:0; line-height:1.5;}

  /* ---------- dashboard ---------- */
  .page-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
  .page-head h2{font-size:24px;}
  .page-head .sub{font-size:13px; color:var(--ink-muted); margin-top:4px;}
  .live-pill{
    font-size:10.5px; font-weight:700; color:var(--green); background:var(--green-bg);
    border:1px solid var(--green-border); border-radius:999px; padding:4px 10px;
  }

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  .kpi-card{padding:18px;}
  .kpi-label{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
  .kpi-value{font-family:var(--serif); font-size:26px; margin-top:6px; color:var(--ink);}
  .kpi-value.blue{color:var(--blue-dark);}
  .kpi-sub{font-size:11.5px; color:var(--ink-muted); margin-top:4px;}
  .kpi-sub.up{color:var(--green);} .kpi-sub.down{color:var(--red);}

  .section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 4px;}
  .section-title h3{font-size:12.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-muted);}
  .section-hint{font-size:12.5px; color:var(--ink-faint); margin:0 0 12px;}

  .quest-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .quest-card{padding:16px; display:flex; flex-direction:column; gap:8px; border-left:3px solid var(--blue);}
  .quest-card.cat-legal{border-left-color:var(--amber);}
  .quest-card.cat-pelanggan{border-left-color:var(--green);}
  .quest-card.cat-volume{border-left-color:var(--red);}
  .quest-cat{font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint);}
  .quest-title{font-size:14px; font-weight:700; line-height:1.3;}
  .quest-meta{font-size:11.5px; color:var(--ink-muted);}
  .quest-impact{font-size:11.5px; color:var(--blue-dark); background:var(--blue-lighter); border-radius:8px; padding:6px 8px; line-height:1.4;}
  .quest-btn{
    margin-top:2px; align-self:flex-start; background:var(--blue); color:#fff; border:none;
    border-radius:8px; padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .quest-btn:hover{background:var(--blue-dark);}
  .quest-empty{padding:20px; text-align:center; color:var(--ink-muted); font-size:13px;}
  .completed-toggle{font-size:12.5px; font-weight:700; color:var(--blue-dark); cursor:pointer; user-select:none;}
  .completed-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .completed-row{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; font-size:12.5px;}
  .completed-row .name{font-weight:600;}
  .completed-row .check{color:var(--green); font-weight:800;}

  .trend-card{padding:20px;}
  .trend-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .period-pills{display:flex; gap:6px; background:var(--canvas); border:1px solid var(--border); border-radius:10px; padding:3px;}
  .period-pill{border:none; background:none; padding:6px 11px; font-size:12px; font-weight:700; color:var(--ink-muted); border-radius:8px; cursor:pointer;}
  .period-pill.active{background:var(--blue); color:#fff;}
  .trend-insight{font-size:12.5px; color:var(--ink-muted); margin:10px 0 6px;}
  .chart-wrap{display:flex; align-items:flex-end; gap:8px; height:150px; margin-top:14px; overflow-x:auto; padding-bottom:2px;}
  .bar-col{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:34px; flex:1; cursor:pointer;}
  .bar-el{width:100%; max-width:38px; background:var(--bar-light); border-radius:6px 6px 3px 3px; transition:background .15s;}
  .bar-col:hover .bar-el, .bar-col.selected .bar-el{background:var(--bar-mid);}
  .bar-col.selected .bar-el{outline:2px solid var(--blue); outline-offset:2px;}
  .bar-label{font-size:10.5px; color:var(--ink-faint); white-space:nowrap;}
  .drilldown{margin-top:16px; border-top:1px dashed var(--border); padding-top:14px;}
  .drilldown h4{font-size:13px; margin:0 0 8px;}
  .prod-row{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--border);}
  .prod-row:last-child{border-bottom:none;}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:14px; margin-top:14px;}
  .legal-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .legal-row:last-child{border-bottom:none;}
  .status-chip{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px;}
  .status-chip.ok{background:var(--green-bg); color:var(--green); border:1px solid var(--green-border);}
  .status-chip.no{background:var(--amber-bg); color:var(--amber);}

  .cta-banner{
    margin-top:22px; padding:20px 22px; border-radius:var(--radius);
    background:linear-gradient(120deg, var(--blue), var(--blue-dark)); color:#fff;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  }
  .cta-banner h3{color:#fff; font-size:16px; margin-bottom:4px;}
  .cta-banner p{margin:0; font-size:12.5px; opacity:.88;}
  .cta-banner .btn{background:#fff; color:var(--blue-dark);}

  /* ---------- pembukuan ---------- */
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
  .search-input{
    flex:1; min-width:200px; padding:10px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:13.5px;
  }
  .search-input:focus{border-color:var(--blue); outline:none;}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:640px;}
  th,td{padding:11px 14px; text-align:left; white-space:nowrap;}
  th{
    font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint);
    border-bottom:1px solid var(--border); cursor:pointer; user-select:none; position:sticky; top:0; background:var(--surface);
  }
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--blue-lighter);}
  .conf-chip{font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px;}
  .conf-chip.high{background:var(--green-bg); color:var(--green);}
  .conf-chip.medium{background:var(--amber-bg); color:var(--amber);}
  .conf-chip.low{background:var(--red-bg); color:var(--red);}

  .add-form{
    display:grid; grid-template-columns:repeat(6,1fr); gap:10px; padding:16px; margin-bottom:14px;
  }
  .add-form input, .add-form select{
    padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:var(--canvas); color:var(--ink); font-size:13px; width:100%;
  }
  .add-form label{font-size:10.5px; color:var(--ink-faint); font-weight:700; display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
  .add-form .full{grid-column:1/-1; display:flex; gap:10px; justify-content:flex-end;}

  /* ---------- skor & kur ---------- */
  .score-hero{display:flex; gap:26px; align-items:center; padding:26px; flex-wrap:wrap;}
  .score-ring{position:relative; width:150px; height:150px; flex-shrink:0;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring-num{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .score-ring-num b{font-family:var(--serif); font-size:34px;}
  .score-ring-num span{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;}
  .factor-list{flex:1; min-width:260px; display:flex; flex-direction:column; gap:10px;}
  .factor-row{display:flex; align-items:center; gap:10px;}
  .factor-name{width:110px; font-size:12.5px; color:var(--ink-muted); flex-shrink:0;}
  .factor-track{flex:1; height:8px; background:var(--bar-track); border-radius:99px; overflow:hidden;}
  .factor-fill{height:100%; background:var(--bar-mid); border-radius:99px;}
  .factor-val{width:34px; text-align:right; font-size:12.5px; font-weight:700;}

  .kur-sim{padding:22px; margin-top:16px;}
  .tenor-pills{display:flex; gap:8px; margin:12px 0 18px;}
  .tenor-pill{border:1px solid var(--border); background:var(--canvas); padding:8px 16px; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink-muted);}
  .tenor-pill.active{background:var(--blue); color:#fff; border-color:var(--blue);}
  .kur-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .kur-box{padding:16px; background:var(--canvas); border-radius:12px;}
  .kur-box .lbl{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;}
  .kur-box .val{font-family:var(--serif); font-size:22px; margin-top:4px; color:var(--blue-dark);}

  /* ---------- chatbot ---------- */
  .chat-shell{max-width:640px; margin:0 auto; display:flex; flex-direction:column; height:560px; border-radius:var(--radius); overflow:hidden;}
  .chat-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:center;}
  .chat-avatar{width:40px; height:40px; border-radius:11px; background:linear-gradient(155deg,var(--blue),var(--blue-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--serif);}
  .chat-head h3{font-size:14.5px;} .chat-head p{margin:2px 0 0; font-size:11.5px; color:var(--ink-faint);}
  .chat-body{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; background:var(--canvas);}
  .bubble{max-width:78%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.5;}
  .bubble.bot{background:var(--surface); border:1px solid var(--border); align-self:flex-start; border-bottom-left-radius:3px;}
  .bubble.user{background:var(--blue); color:#fff; align-self:flex-end; border-bottom-right-radius:3px;}
  .chips{display:flex; gap:7px; flex-wrap:wrap; padding:0 18px 12px; background:var(--canvas);}
  .chip-btn{border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; color:var(--ink-muted);}
  .chip-btn:hover{border-color:var(--blue); color:var(--blue-dark);}
  .chat-input-row{display:flex; gap:8px; padding:14px; border-top:1px solid var(--border); background:var(--surface);}
  .chat-input-row input{flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--canvas); color:var(--ink); font-size:13.5px;}
  .chat-input-row input:focus{outline:none; border-color:var(--blue);}
  .send-btn{background:var(--blue); color:#fff; border:none; border-radius:10px; padding:0 18px; font-weight:700; cursor:pointer;}

  /* ---------- profil ---------- */
  .profile-head{display:flex; gap:18px; align-items:center; padding:22px;}

<script>
/* =====================================================================
   BUMIRA - standalone interactive showcase
   Semua angka dihitung live dari data contoh di bawah, memakai rumus
   yang sama persis dengan compute_score() / get_kur_offer() di aplikasi asli.
   Tidak ada koneksi keluar - seluruhnya berjalan di file ini saja.
===================================================================== */

/* ---------------- state & seed data ---------------- */
const state = {
  screen: 'beranda',
  period: '1m',
  selectedBucket: null,
  tenor: 24,
  showCompleted: false,
  chatLog: [],
  notifPanelOpen: false,
};

const PRODUCTS = [
  { name: 'Kriya Tenun Nusantara', harga: 250000 },
  { name: 'Batik Cap Truntum', harga: 120000 },
  { name: 'Selendang Batik', harga: 75000 },
  { name: 'Sarung Batik', harga: 95000 },
  { name: 'Batik Print Motif Parang', harga: 60000 },
];
const CUSTOMERS = ['Ibu Sri', 'Pak Hartono', 'Toko Mekar Jaya', 'Bu Wulan', 'Pak Agus'];

let txns = [];
let legal = { nib: true, pirt: false, halal: false };
let notifications = [];
let idCounter = 1;

function daysAgo(n){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() - n); return d; }
function isoDate(d){ return d.toISOString().slice(0,10); }
function rand(min,max){ return Math.random()*(max-min)+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function seed(){
  txns = [];
  // 90 hari ke belakang, aktif di sekitar 60% hari, dengan tren naik ringan
  for (let i = 89; i >= 0; i--){
    const active = Math.random() < (i < 30 ? 0.72 : 0.55); // lebih aktif di 30 hari terakhir
    if (!active) continue;
    const nTx = Math.random() < 0.3 ? 2 : 1;
    for (let k = 0; k < nTx; k++){
      const p = pick(PRODUCTS);
      const qty = Math.round(rand(1,5));
      const repeatCustomer = Math.random() < 0.4;
      txns.push({
        id: idCounter++,
        tanggal: isoDate(daysAgo(i)),
        produk: p.name,
        qty,
        satuan: 'pcs',
        harga: p.harga,
        total: p.harga * qty,
        pelanggan: repeatCustomer ? pick(CUSTOMERS) : '',
        source: Math.random() < 0.25 ? 'chat_parse' : 'manual',
        confidence: Math.random() < 0.15 ? 'medium' : (Math.random() < 0.05 ? 'low' : 'high'),
      });
    }
  }
  txns.sort((a,b) => a.tanggal.localeCompare(b.tanggal));

  notifications = [
    { id: 1, type: 'capture_daily', title: `2 transaksi baru terdeteksi hari ini`, created: new Date(Date.now()-3*3600e3), read: false },
    { id: 2, type: 'monthly_recap', title: 'Pembukuan bulan lalu selesai disusun - cek ringkasannya', created: new Date(Date.now()-2*86400e3), read: false },
    { id: 3, type: 'low_confidence', title: 'Ada 1 chat yang BUMIRA kurang yakin bacanya - cek & koreksi manual?', created: new Date(Date.now()-4*86400e3), read: true },
  ];
}
seed();

/* ---------------- score & KUR engine (mirror server/schema.sql) ---------------- */
function todayISO(){ return isoDate(new Date()); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

function computeScore(list, legalFlags){
  const today = new Date(); today.setHours(12,0,0,0);
  const within = (t, n) => daysBetween(t.tanggal, isoDate(today)) <= n && daysBetween(t.tanggal, isoDate(today)) >= 0;

  const activeDaysSet = new Set(list.filter(t => within(t,90)).map(t => t.tanggal));
  const consistency = Math.min(100, activeDaysSet.size/30*100);

  const last30 = list.filter(t => within(t,30)).reduce((s,t)=>s+t.total,0);
  const prev30 = list.filter(t => { const d = daysBetween(t.tanggal, isoDate(today)); return d>30 && d<=60; }).reduce((s,t)=>s+t.total,0);
  const growth = prev30 === 0 ? (last30 > 0 ? 1 : 0) : (last30-prev30)/prev30;
  const volume = Math.max(0, Math.min(100, 50 + growth*100));

  const withCust = list.filter(t => within(t,180));
  const filledCount = withCust.filter(t => t.pelanggan && t.pelanggan.trim()).length;
  const counts = {};
  withCust.forEach(t => { if (t.pelanggan) counts[t.pelanggan] = (counts[t.pelanggan]||0)+1; });
  const repeatCount = withCust.filter(t => t.pelanggan && counts[t.pelanggan] > 1).length;
  const pelanggan = filledCount < 3 ? 50 : Math.round(repeatCount/filledCount*100);

  const legalScore = ((legalFlags.nib?1:0)+(legalFlags.pirt?1:0)+(legalFlags.halal?1:0))/3*100;

  const total = Math.round(0.25*(consistency+volume+pelanggan+legalScore));
  return {
    total_score: total,
    factors: [
      { key:'consistency', label:'Konsistensi', val: Math.round(consistency) },
      { key:'volume', label:'Volume Omzet', val: Math.round(volume) },
      { key:'pelanggan', label:'Pelanggan', val: Math.round(pelanggan) },
      { key:'legal', label:'Legalitas', val: Math.round(legalScore) },
    ],
    activeDaysSet, last30, prev30, growth, filledCount, repeatCount,
  };
}

function computeStreak(list){
  const daySet = new Set(list.map(t=>t.tanggal));
  let streak = 0;
  let cursor = new Date(); cursor.setHours(12,0,0,0);
  if (!daySet.has(isoDate(cursor))) cursor.setDate(cursor.getDate()-1);
  while (daySet.has(isoDate(cursor))){ streak++; cursor.setDate(cursor.getDate()-1); }
  return streak;
}

function kurOffer(list, score, tenor){
  const omzet6 = list.filter(t => daysBetween(t.tanggal, todayISO()) <= 180).reduce((s,t)=>s+t.total,0);
  const rata = omzet6/6;
  const multiplier = score >= 80 ? 4.5 : score >= 60 ? 3.5 : 2.5;
  const plafon = Math.max(0, Math.min(100000000, Math.floor(rata*multiplier/500000)*500000));
  const r = 0.06/12;
  const cicilan = plafon > 0 ? Math.round(plafon*r/(1-Math.pow(1+r,-tenor))) : 0;
  return { plafon, cicilan, rata };
}

function labaBulanIni(list){
  const now = new Date();
  const thisMonth = list.filter(t => { const d = new Date(t.tanggal); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); });
  const omzet = thisMonth.reduce((s,t)=>s+t.total,0);
  const beban = Math.round(omzet*0.58) + 800000; // bahan baku + overhead tetap perkiraan
  return { omzet, beban, laba: omzet-beban };
}

/* ---------------- quest engine (mirror server/routes/quests.js) ---------------- */
function buildQuestCatalog(m){
  const streak = computeStreak(txns);
  const growthPct = Math.round(m.growth*100);
  return [
    {
      key:'streak5', category:'consistency', title:'Catat transaksi 5 hari berturut-turut',
      poin:15, estimasi:'Otomatis terdeteksi',
      done: streak >= 5,
      impact: `Naikkan skor Konsistensi - kamu di hari ke-${streak} dari target 5.`,
      target:'pembukuan',
    },
    {
      key:'catat-hari-ini', category:'consistency', title:'Catat minimal 1 transaksi hari ini',
      poin:8, estimasi:'2 menit',
      done: txns.some(t=>t.tanggal===todayISO()),
      impact:'Setiap hari aktif langsung menambah skor Konsistensi bulan ini.',
      target:'pembukuan',
    },
    {
      key:'omzet-naik15', category:'volume', title:'Naikkan omzet 15% dari bulan lalu',
      poin:20, estimasi:'Otomatis terdeteksi',
      done: m.growth >= 0.15,
      impact: `Omzet 30 hari terakhir ${growthPct>=0?'naik':'turun'} ${Math.abs(growthPct)}% - kejar 15% biar skor Volume tembus 65+.`,
      target:'pembukuan',
    },
    {
      key:'catat-pelanggan', category:'pelanggan', title:'Isi nama pelanggan di 3 transaksi terbaru',
      poin:10, estimasi:'3 menit',
      done: m.filledCount >= 3,
      impact:'Data pelanggan bikin skor Pelanggan lebih akurat, bukan nilai default 50.',
      target:'pembukuan',
    },
    {
      key:'pelanggan-ulang', category:'pelanggan', title:'Dapatkan pelanggan yang beli ulang',
      poin:15, estimasi:'Otomatis terdeteksi',
      done: m.repeatCount >= 3,
      impact:'Pembeli yang balik lagi jadi bukti kuat usahamu dipercaya pasar.',
      target:'pembukuan',
    },
    {
      key:'urus-nib', category:'legal', title:'Urus NIB (Nomor Induk Berusaha)',
      poin:20, estimasi:'15 menit', berbayar:false,
      done: legal.nib,
      impact:'NIB gratis lewat OSS dan langsung menambah 1/3 skor Legalitas.',
      target:'kur',
    },
    {
      key:'urus-pirt', category:'legal', title:'Lengkapi izin P-IRT',
      poin:20, estimasi:'~3 hari kerja', berbayar:true,
      done: legal.pirt,
      impact:'P-IRT membuka skor Legalitas 66 - makin dekat ke ambang siap-KUR.',
      target:'kur',
    },
    {
      key:'urus-halal', category:'legal', title:'Ajukan Sertifikat Halal',
      poin:20, estimasi:'~7 hari kerja', berbayar:true,
      done: legal.halal,
      impact:'Melengkapi 3 legalitas sekaligus mengunci skor Legalitas ke 100.',
      target:'kur',
    },
  ];
}

function pickActiveQuests(quests, factors){
  const sorted = [...factors].sort((a,b)=>a.val-b.val);
  const byCat = new Map(sorted.map(f => [f.key, quests.filter(q=>q.category===f.key && !q.done)
    .sort((a,b) => (a.estimasi==='Otomatis terdeteksi'?0:1) - (b.estimasi==='Otomatis terdeteksi'?0:1) || b.poin-a.poin)]));
  const active = [];
  for (const f of sorted){ if (active.length>=3) break; const list=byCat.get(f.key); if (list.length) active.push(list.shift()); }
  for (const f of sorted){ if (active.length>=3) break; const list=byCat.get(f.key); while(list.length && active.length<3) active.push(list.shift()); }
  return active;
}

function evaluateBadges(m, streak){
  const done = m.quests.filter(q=>q.done).length;
  const legalAll = legal.nib && legal.pirt && legal.halal;
  return [
    { key:'umkm_pemula', name:'UMKM Pemula', icon:'🌱', earned: done>=1 },
    { key:'konsisten', name:'Konsisten', icon:'🔥', earned: streak>=30 },
    { key:'legal_lengkap', name:'Legal Lengkap', icon:'📋', earned: legalAll },
    { key:'siap_kur', name:'Siap KUR', icon:'🏦', earned: m.score.total_score>70 },
    { key:'umkm_unggulan', name:'UMKM Unggulan', icon:'⭐', earned: m.score.total_score>85 },
  ];
}

/* ---------------- derived snapshot ---------------- */
let lastScoreSeen = null;
function snapshot(){
  const score = computeScore(txns, legal);
  const streak = computeStreak(txns);
  const quests = buildQuestCatalog(score);
  const active_quests = pickActiveQuests(quests, score.factors);
  const completed_quests = quests.filter(q=>q.done);
  const badges = evaluateBadges({score, quests}, streak);
  const kur = kurOffer(txns, score.total_score, state.tenor);
  const laba = labaBulanIni(txns);

  if (lastScoreSeen !== null && score.total_score > lastScoreSeen){
    pushNotification('score_increase', `Skormu naik jadi ${score.total_score}!`);
    showToast(`🎉 Skormu naik jadi ${score.total_score}!`);
  }
  lastScoreSeen = score.total_score;

  return { score, streak, quests, active_quests, completed_quests, badges, kur, laba };
}

function pushNotification(type, title){
  notifications.unshift({ id: idCounter++, type, title, created: new Date(), read:false });
  renderNotifDot();
}

function showToast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3800);
}

/* ---------------- formatting ---------------- */
function rupiah(n){ return 'Rp' + Math.round(n).toLocaleString('id-ID'); }
function tanggalID(iso){ return new Date(iso).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); }
function timeAgo(d){
  const mins = Math.floor((Date.now()-d.getTime())/60000);
  if (mins<1) return 'Baru saja';
  if (mins<60) return `${mins} menit lalu`;
  const hrs = Math.floor(mins/60); if (hrs<24) return `${hrs} jam lalu`;
  const days = Math.floor(hrs/24); return days===1?'Kemarin':`${days} hari lalu`;
}

/* ---------------- theme ---------------- */
function toggleTheme(){
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next==='dark' ? '☀️' : '🌙';
}

/* ---------------- notif panel ---------------- */
function renderNotifDot(){
  const unread = notifications.filter(n=>!n.read).length;
  const dot = document.getElementById('notifDot');
  if (unread>0){ dot.style.display='flex'; dot.textContent = unread>9?'9+':unread; } else { dot.style.display='none'; }
}
function toggleNotifPanel(e){
  e.stopPropagation();
  state.notifPanelOpen = !state.notifPanelOpen;
  const panel = document.getElementById('notifPanel');
  if (!state.notifPanelOpen){ panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  panel.innerHTML = `<div class="panel-pop-head"><strong>Notifikasi</strong><span onclick="markAllRead()">Tandai semua dibaca</span></div>` +
    (notifications.length===0 ? `<div class="notif-empty">Belum ada notifikasi.</div>` :
    notifications.map(n=>`<button class="notif-row ${n.read?'':'unread'}" onclick="openNotif(${n.id})">
        <span class="notif-row-title">${n.title}</span><span class="notif-row-time">${timeAgo(n.created)}</span>
      </button>`).join(''));
}
function markAllRead(){ notifications.forEach(n=>n.read=true); renderNotifDot(); toggleNotifPanel({stopPropagation(){}}); }
function openNotif(id){
  const n = notifications.find(x=>x.id===id); if (n) n.read = true;
  renderNotifDot();
  document.getElementById('notifPanel').classList.add('hidden'); state.notifPanelOpen=false;
  goScreen(n && n.type==='monthly_recap' ? 'kur' : 'dashboard');
}
document.addEventListener('click', (e)=>{
  const panel = document.getElementById('notifPanel');
  if (state.notifPanelOpen && !panel.contains(e.target)) { panel.classList.add('hidden'); state.notifPanelOpen=false; }
});

/* ---------------- navigation ---------------- */
function goScreen(name){
  state.screen = name; state.selectedBucket = null;
  document.querySelectorAll('.navlink[data-screen]').forEach(b=>b.classList.toggle('current', b.dataset.screen===name));
  render();
  window.scrollTo({top:0, behavior:'auto'});
}

/* ---------------- trend buckets ---------------- */
const PERIODS = [
  { key:'1w', label:'1 Minggu', days:7, group:'day' },
  { key:'3w', label:'3 Minggu', days:21, group:'week' },
  { key:'1m', label:'1 Bulan', days:30, group:'week' },
  { key:'3m', label:'3 Bulan', days:90, group:'month' },
];
function buildBuckets(periodKey){
  const period = PERIODS.find(p=>p.key===periodKey);
  const inRange = txns.filter(t => daysBetween(t.tanggal, todayISO()) <= period.days);
  const buckets = new Map();
  inRange.forEach(t=>{
    let key, label;
    const d = new Date(t.tanggal);
    if (period.group==='day'){ key=t.tanggal; label = d.toLocaleDateString('id-ID',{weekday:'short', day:'numeric'}); }
    else if (period.group==='week'){
      const weekStart = new Date(d); weekStart.setDate(d.getDate()-d.getDay());
      key = isoDate(weekStart); label = 'Mgg ' + weekStart.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
    } else {
      key = `${d.getFullYear()}-${d.getMonth()}`; label = d.toLocaleDateString('id-ID',{month:'short'});
    }
    if (!buckets.has(key)) buckets.set(key, { key, label, total:0, txns:[] });
    const b = buckets.get(key); b.total += t.total; b.txns.push(t);
  });
  return [...buckets.values()].sort((a,b)=>a.key.localeCompare(b.key));
}
function topProductsInBucket(bucket){
  const map = {};
  bucket.txns.forEach(t => { map[t.produk] = (map[t.produk]||0) + t.total; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,4);
}

/* ---------------- render: screens ---------------- */
function render(){
  const app = document.getElementById('app');
  renderNotifDot();
  if (state.screen==='beranda') app.innerHTML = renderBeranda();
  else if (state.screen==='dashboard') app.innerHTML = renderDashboard();
  else if (state.screen==='pembukuan') app.innerHTML = renderPembukuan();
  else if (state.screen==='kur') app.innerHTML = renderKur();
  else if (state.screen==='mira') app.innerHTML = renderMira();
  else if (state.screen==='profil') app.innerHTML = renderProfil();

  if (state.screen==='pembukuan') wirePembukuan();
  if (state.screen==='mira') wireMira();
}

        <div class="hero-stat"><b>68</b><span>SKOR RATA-RATA</span></div>
      </div>
      <p class="hero-note">*angka agregat ilustratif untuk showcase ini</p>

}

function renderDashboard(){
  const s = snapshot();
  const buckets = buildBuckets(state.period);
  const maxTotal = Math.max(1, ...buckets.map(b=>b.total));
  const selected = state.selectedBucket ? buckets.find(b=>b.key===state.selectedBucket) : null;
  const growthPct = Math.round(s.score.growth*100);

  return `
  <div class="screen">
    <div class="page-head">
      <div><h2>Dashboard Usaha</h2><div class="sub">Batik Kliwon Jaya · Tekstil &amp; Batik · Sentra Kreatif Indonesia</div></div>
      <span class="live-pill">● Data real dari pembukuan (simulasi)</span>
    </div>

    <div class="kpi-grid">
      <div class="card kpi-card"><div class="kpi-label">Skor Kelayakan</div><div class="kpi-value blue tabular">${s.score.total_score}<span style="font-size:14px;color:var(--ink-faint);">/100</span></div><div class="kpi-sub">${s.score.total_score>70?'Siap ajukan KUR':'Masih bisa dinaikkan'}</div></div>
      <div class="card kpi-card"><div class="kpi-label">Omzet Bulan Ini</div><div class="kpi-value tabular">${rupiah(s.laba.omzet)}</div><div class="kpi-sub ${growthPct>=0?'up':'down'}">${growthPct>=0?'▲':'▼'} ${Math.abs(growthPct)}% vs 30 hari sebelumnya</div></div>
      <div class="card kpi-card"><div class="kpi-label">Laba Bersih Bulan Ini</div><div class="kpi-value tabular">${rupiah(s.laba.laba)}</div><div class="kpi-sub">Setelah bahan baku &amp; biaya tetap</div></div>
      <div class="card kpi-card"><div class="kpi-label">Plafon KUR Tersedia</div><div class="kpi-value blue tabular">${rupiah(s.kur.plafon)}</div><div class="kpi-sub">Tenor ${state.tenor} bulan · ${rupiah(s.kur.cicilan)}/bulan</div></div>
    </div>

    <div class="section-title"><h3>Langkah yang Direkomendasikan (${s.active_quests.length})</h3></div>
    <p class="section-hint">Langkah berikutnya yang paling berdampak buat skormu, diambil dari faktor yang paling lemah dulu.</p>
    ${s.active_quests.length===0 ? `<div class="card quest-empty">Semua langkah yang tersedia sudah kamu selesaikan. Mantap!</div>` : `
    <div class="quest-grid">
      ${s.active_quests.map(q=>`
        <div class="card quest-card cat-${q.category}">
          <span class="quest-cat">${q.category}</span>
          <div class="quest-title">${q.title}</div>
          <div class="quest-meta">+${q.poin} poin · ${q.estimasi}${q.berbayar!==undefined ? (q.berbayar?' · Berbayar':' · Gratis') : ''}</div>
          <div class="quest-impact">${q.impact}</div>
          <button class="quest-btn" onclick="doQuest('${q.key}')">${q.estimasi==='Otomatis terdeteksi' ? 'Catat Transaksi →' : 'Mulai Sekarang'}</button>
        </div>`).join('')}
    </div>`}
    <div style="margin-top:14px;">
      <span class="completed-toggle" onclick="toggleCompleted()">✓ Langkah Selesai (${s.completed_quests.length}) ${state.showCompleted?'▴':'▾'}</span>
      ${state.showCompleted ? `<div class="completed-list">${s.completed_quests.length===0?'<div class="card completed-row"><span class="name" style="color:var(--ink-faint)">Belum ada yang selesai.</span></div>':s.completed_quests.map(q=>`<div class="card completed-row"><span class="name">${q.title}</span><span class="check">✓ +${q.poin}</span></div>`).join('')}</div>` : ''}
    </div>

    <div class="section-title"><h3>Tren Omzet</h3></div>
    <div class="card trend-card">
      <div class="trend-head">
        <div class="trend-insight" style="margin:0;">${growthPct>=0?'Omzet sedang naik':'Omzet sedang turun'}, klik salah satu batang untuk lihat rincian produknya.</div>
        <div class="period-pills">${PERIODS.map(p=>`<button class="period-pill ${state.period===p.key?'active':''}" onclick="setPeriod('${p.key}')">${p.label}</button>`).join('')}</div>
      </div>
      <div class="chart-wrap">
        ${buckets.map(b=>`
          <div class="bar-col ${state.selectedBucket===b.key?'selected':''}" onclick="selectBucket('${b.key}')" title="${rupiah(b.total)}">
            <div class="bar-el" style="height:${Math.max(6, b.total/maxTotal*118)}px;"></div>
            <div class="bar-label">${b.label}</div>
          </div>`).join('') || '<div class="notif-empty">Belum ada transaksi di rentang ini.</div>'}
      </div>
      ${selected ? `
      <div class="drilldown">
        <h4>Produk Terlaris - ${selected.label} (${rupiah(selected.total)})</h4>
        ${topProductsInBucket(selected).map(([name,total])=>`<div class="prod-row"><span>${name}</span><span class="tabular">${rupiah(total)}</span></div>`).join('')}
      </div>` : ''}
    </div>

    <div class="two-col">
      <div class="card card-pad">
        <div class="section-title" style="margin-top:0;"><h3>Produk Terlaris (90 hari)</h3></div>
        ${topProductsInBucket({txns: txns.filter(t=>daysBetween(t.tanggal, todayISO())<=90)}).map(([name,total])=>`<div class="prod-row"><span>${name}</span><span class="tabular">${rupiah(total)}</span></div>`).join('')}
      </div>
      <div class="card card-pad">
        <div class="section-title" style="margin-top:0;"><h3>Kelengkapan Legalitas</h3></div>
        <div class="legal-row"><span>NIB</span><span class="status-chip ${legal.nib?'ok':'no'}">${legal.nib?'Lengkap':'Belum'}</span></div>
        <div class="legal-row"><span>P-IRT</span><span class="status-chip ${legal.pirt?'ok':'no'}">${legal.pirt?'Lengkap':'Belum'}</span></div>
        <div class="legal-row"><span>Sertifikat Halal</span><span class="status-chip ${legal.halal?'ok':'no'}">${legal.halal?'Lengkap':'Belum'}</span></div>
      </div>
    </div>

    <div class="cta-banner">
      <div><h3>Skor ${s.score.total_score} - cek simulasi plafon KUR-mu</h3><p>Lihat rincian faktor skor dan cicilan per tenor di halaman Skor &amp; KUR.</p></div>
      <button class="btn" onclick="goScreen('kur')">Buka Skor &amp; KUR →</button>
    </div>
  </div>`;
}

function doQuest(key){
  if (key==='urus-pirt'){ legal.pirt = true; showToast('P-IRT ditandai lengkap.'); }
  else if (key==='urus-halal'){ legal.halal = true; showToast('Sertifikat Halal ditandai lengkap.'); }
  else if (key==='urus-nib'){ legal.nib = true; showToast('NIB ditandai lengkap.'); }
  else if (key==='catat-pelanggan'){
    let filled = 0;
    for (let i=txns.length-1; i>=0 && filled<3; i--){ if (!txns[i].pelanggan){ txns[i].pelanggan = pick(CUSTOMERS); filled++; } }
    showToast('Nama pelanggan dilengkapi di 3 transaksi terakhir.');
  } else if (key==='pelanggan-ulang'){
    const name = pick(CUSTOMERS);
    for (let i=0;i<3;i++) txns.push(mkTxn({pelanggan:name}));
    showToast(`Transaksi ulang dari ${name} dicatat.`);
  } else if (key==='omzet-naik15'){
    for (let i=0;i<3;i++) txns.push(mkTxn({daysBack: Math.floor(rand(0,5))}));
    showToast('Transaksi baru senilai besar dicatat hari ini.');
  } else if (key==='catat-hari-ini' || key==='streak5'){
    txns.push(mkTxn({daysBack:0}));
    showToast('Transaksi hari ini dicatat.');
  }
  render();
}
function mkTxn(opts={}){
  const p = pick(PRODUCTS);
  const qty = Math.round(rand(2,6));
  return {
    id:idCounter++, tanggal: isoDate(daysAgo(opts.daysBack||0)), produk:p.name, qty, satuan:'pcs',
    harga:p.harga, total:p.harga*qty*(opts.boost?2:1), pelanggan: opts.pelanggan||'', source:'manual', confidence:'high',
  };
}
function setPeriod(k){ state.period=k; state.selectedBucket=null; render(); }
function selectBucket(k){ state.selectedBucket = state.selectedBucket===k ? null : k; render(); }
function toggleCompleted(){ state.showCompleted = !state.showCompleted; render(); }

/* ---------------- pembukuan ---------------- */
let pembukuanSort = { col:'tanggal', dir:'desc' };
let pembukuanQuery = '';
function renderPembukuan(){
  return `
  <div class="screen">
    <div class="page-head"><div><h2>Pembukuan</h2><div class="sub">Semua transaksi tercatat, bisa dicari &amp; diurutkan.</div></div>
      <button class="btn btn-primary btn-sm" onclick="toggleAddForm()">+ Tambah Transaksi</button>
    </div>
    <div class="card add-form hidden" id="addForm">
      <div><label>Tanggal</label><input type="date" id="fTanggal" value="${todayISO()}"/></div>
      <div><label>Produk</label><input list="produkList" id="fProduk" placeholder="Nama produk"/><datalist id="produkList">${PRODUCTS.map(p=>`<option value="${p.name}">`).join('')}</datalist></div>
      <div><label>Qty</label><input type="number" id="fQty" value="1" min="1"/></div>
      <div><label>Satuan</label><input list="satuanList" id="fSatuan" value="pcs"/><datalist id="satuanList"><option value="pcs"><option value="potong"><option value="lusin"><option value="meter"></datalist></div>
      <div><label>Harga Satuan</label><input type="number" id="fHarga" value="50000"/></div>
      <div><label>Pelanggan (opsional)</label><input id="fPelanggan" placeholder="Nama pelanggan"/></div>
      <div class="full"><button class="btn btn-ghost btn-sm" onclick="toggleAddForm()">Batal</button><button class="btn btn-primary btn-sm" onclick="submitTxn()">Simpan Transaksi</button></div>
    </div>
    <div class="toolbar"><input class="search-input" id="txnSearch" placeholder="Cari produk atau pelanggan..." value="${pembukuanQuery}"/></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th onclick="sortTxn('tanggal')">Tanggal</th><th onclick="sortTxn('produk')">Produk</th>
          <th onclick="sortTxn('qty')">Qty</th><th onclick="sortTxn('total')">Total</th>
          <th onclick="sortTxn('pelanggan')">Pelanggan</th><th>Sumber</th>
        </tr></thead>
        <tbody id="txnBody"></tbody>
      </table>
    </div>
  </div>`;
}
function filteredSortedTxns(){
  const q = pembukuanQuery.toLowerCase();
  let list = txns.filter(t => !q || t.produk.toLowerCase().includes(q) || (t.pelanggan||'').toLowerCase().includes(q));
  list = [...list].sort((a,b)=>{
    const va=a[pembukuanSort.col], vb=b[pembukuanSort.col];
    const cmp = typeof va==='number' ? va-vb : String(va).localeCompare(String(vb));
    return pembukuanSort.dir==='asc' ? cmp : -cmp;
  });
  return list;
}
function renderTxnBody(){
  document.getElementById('txnBody').innerHTML = filteredSortedTxns().map(t=>`
    <tr><td>${tanggalID(t.tanggal)}</td><td>${t.produk}</td><td class="tabular">${t.qty} ${t.satuan}</td>
    <td class="tabular">${rupiah(t.total)}</td><td>${t.pelanggan||'<span style="color:var(--ink-faint)"> - </span>'}</td>
    <td><span class="conf-chip ${t.confidence}">${t.source==='chat_parse'?'Chat':'Manual'}</span></td></tr>`).join('') ||
    `<tr><td colspan="6" style="text-align:center;color:var(--ink-faint);padding:24px;">Tidak ada transaksi cocok.</td></tr>`;
}
function wirePembukuan(){
  renderTxnBody();
  document.getElementById('txnSearch').addEventListener('input', (e)=>{ pembukuanQuery = e.target.value; renderTxnBody(); });
}
function sortTxn(col){
  pembukuanSort.dir = pembukuanSort.col===col && pembukuanSort.dir==='desc' ? 'asc':'desc';
  pembukuanSort.col = col; renderTxnBody();
}
function toggleAddForm(){ document.getElementById('addForm').classList.toggle('hidden'); }
function submitTxn(){
  const produk = document.getElementById('fProduk').value.trim() || 'Produk Tanpa Nama';
  const qty = Math.max(1, parseInt(document.getElementById('fQty').value,10)||1);
  const harga = Math.max(0, parseInt(document.getElementById('fHarga').value,10)||0);
  txns.push({
    id:idCounter++, tanggal: document.getElementById('fTanggal').value || todayISO(),
    produk, qty, satuan: document.getElementById('fSatuan').value||'pcs', harga, total: qty*harga,
    pelanggan: document.getElementById('fPelanggan').value.trim(), source:'manual', confidence:'high',
  });
  toggleAddForm();
  showToast('Transaksi tersimpan.');
  renderTxnBody();
}

/* ---------------- skor & kur ---------------- */
function renderKur(){
  const s = snapshot();
  const circ = 2*Math.PI*58;
  const dash = circ * (s.score.total_score/100);
  return `
  <div class="screen">
    <div class="page-head"><div><h2>Skor &amp; KUR</h2><div class="sub">Rincian skor kelayakan dan simulasi pinjaman KUR.</div></div></div>
    <div class="card score-hero">
      <div class="score-ring">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="58" fill="none" stroke="var(--bar-track)" stroke-width="12"/>
          <circle cx="75" cy="75" r="58" fill="none" stroke="var(--blue)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${dash} ${circ}"/>
        </svg>
        <div class="score-ring-num"><b>${s.score.total_score}</b><span>DARI 100</span></div>
      </div>
      <div class="factor-list">
        ${s.score.factors.map(f=>`
          <div class="factor-row"><span class="factor-name">${f.label}</span>
            <div class="factor-track"><div class="factor-fill" style="width:${f.val}%;"></div></div>
            <span class="factor-val tabular">${f.val}</span></div>`).join('')}
      </div>
    </div>

    <div class="card kur-sim">
      <div class="section-title" style="margin-top:0;"><h3>Simulasi KUR</h3></div>
      <div class="tenor-pills">${[12,24,36].map(t=>`<button class="tenor-pill ${state.tenor===t?'active':''}" onclick="setTenor(${t})">${t} bulan</button>`).join('')}</div>
      <div class="kur-grid">
        <div class="kur-box"><div class="lbl">Plafon Tersedia</div><div class="val tabular">${rupiah(s.kur.plafon)}</div></div>
        <div class="kur-box"><div class="lbl">Cicilan / Bulan</div><div class="val tabular">${rupiah(s.kur.cicilan)}</div></div>
        <div class="kur-box"><div class="lbl">Rata-rata Omzet / Bulan</div><div class="val tabular">${rupiah(s.kur.rata)}</div></div>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-top:16px;" onclick="showToast('Ini demo - di aplikasi asli, tombol ini mengunduh PDF berkas KUR sungguhan.')">Unduh Berkas (PDF)</button>
    </div>
  </div>`;
}
function setTenor(t){ state.tenor = t; render(); }

/* ---------------- mira ---------------- */
function renderMira(){
  if (state.chatLog.length===0){
    state.chatLog.push({ role:'bot', text:`Halo, aku Mira 👋 Aku asisten usaha BUMIRA yang membantu membaca data pembukuan dan menentukan langkah berikutnya. Coba tanya soal skor, omzet, laba, KUR, legalitas, atau pelanggan.` });
  }
  return `
  <div class="screen">
    <div class="chat-shell card">
      <div class="chat-head"><div class="chat-avatar">M</div><div><h3>Mira</h3><p>Asisten usaha BUMIRA</p></div></div>
      <div class="chat-body" id="chatBody">${state.chatLog.map(m=>`<div class="bubble ${m.role}">${m.text}</div>`).join('')}</div>
      <div class="chips">
        <button class="chip-btn" onclick="askMira('Berapa skorku sekarang?')">Skorku berapa?</button>
        <button class="chip-btn" onclick="askMira('Omzet bulan ini berapa?')">Omzet bulan ini</button>
        <button class="chip-btn" onclick="askMira('Aku bisa pinjam KUR berapa?')">Simulasi KUR</button>
        <button class="chip-btn" onclick="askMira('Legalitasku gimana?')">Cek legalitas</button>
      </div>
      <div class="chat-input-row">
        <input id="miraInput" placeholder="Tanya Mira..." onkeydown="if(event.key==='Enter') sendMira();"/>
        <button class="send-btn" onclick="sendMira()">Kirim</button>
      </div>
    </div>
  </div>`;
}
function wireMira(){ const body=document.getElementById('chatBody'); if (body) body.scrollTop = body.scrollHeight; }
function sendMira(){
  const input = document.getElementById('miraInput');
  const text = input.value.trim(); if (!text) return;
  input.value = '';
  askMira(text);
}
function askMira(text){
  state.chatLog.push({ role:'user', text });
  state.chatLog.push({ role:'bot', text: answerMira(text) });
  render();
}
function answerMira(q){
  const s = snapshot();
  const t = q.toLowerCase();
  if (t.includes('skor') || t.includes('kelayakan')){
    const f = s.score.factors.map(x=>`${x.label} ${x.val}`).join(', ');
    return `Skor kelayakanmu sekarang ${s.score.total_score}/100 (${f}).`;
  }
  if (t.includes('omzet')){
    return `Omzet bulan ini ${rupiah(s.laba.omzet)}, ${s.score.growth>=0?'naik':'turun'} ${Math.abs(Math.round(s.score.growth*100))}% dibanding 30 hari sebelumnya.`;
  }
  if (t.includes('laba') || t.includes('untung')){
    return `Estimasi laba bersih bulan ini ${rupiah(s.laba.laba)}, dari omzet ${rupiah(s.laba.omzet)} dikurangi beban ${rupiah(s.laba.beban)}.`;
  }
  if (t.includes('kur') || t.includes('pinjam') || t.includes('plafon')){
    return `Dengan skor ${s.score.total_score}, plafon KUR yang tersedia ${rupiah(s.kur.plafon)} dengan cicilan ${rupiah(s.kur.cicilan)}/bulan untuk tenor ${state.tenor} bulan.`;
  }
  if (t.includes('legal') || t.includes('nib') || t.includes('pirt') || t.includes('halal')){
    const items = [['NIB',legal.nib],['P-IRT',legal.pirt],['Sertifikat Halal',legal.halal]];
    return `Legalitasmu: ${items.map(([n,v])=>`${n} ${v?'✓ lengkap':'belum'}`).join(', ')}.`;
  }
  if (t.includes('pelanggan')){
    return `Dari transaksi 180 hari terakhir, ${s.score.repeatCount} dari ${s.score.filledCount} transaksi berpelanggan tercatat adalah pembeli ulang.`;
  }
  return `Aku bisa bantu jawab soal skor, omzet, laba, simulasi KUR, legalitas, atau pelanggan - coba tanya salah satunya.`;
}

/* ---------------- boot ---------------- */
render();
document.querySelector('.navlink[data-screen="beranda"]').classList.add('current');
</script>
